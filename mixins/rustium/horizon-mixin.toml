[mod]
id       = "rustium"
version  = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "9d979caa48a3bb58203319b9ea044db58c38e0d8"

# ── Module ────────────────────────────────────────────────────────────────────
[[module]]
id     = "runtime"
file   = "crates/horizon-client/src/game.rs"
name   = "rustium"
source = "runtime.rs"

# ── Hook: every frame ─────────────────────────────────────────────────────────
[[injection]]
id      = "frame"
kind    = "HEAD"
target  = "horizon_client::game::native_hooks::Game<'_>::native_frame"
helper  = "frame.rs"
bindings = [
  { name = "game",    ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "elapsed", ty = "std::time::Duration",        value = "elapsed"    },
]

# ── Hook: HUD draw ────────────────────────────────────────────────────────────
[[injection]]
id      = "hud"
kind    = "HEAD"
target  = "horizon_client::game::native_hooks::Game<'_>::native_hud"
helper  = "hud.rs"
bindings = [
  { name = "game",    ty = "&mut crate::game::Game<'_>",              value = "&mut *self"    },
  { name = "batch",   ty = "&mut horizon_client::hud::HudBatch",      value = "&mut *batch"   },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]

# ── Hook: HUD throttle ────────────────────────────────────────────────────────
[[injection]]
id          = "hud_throttle"
kind        = "HEAD"
cancellable = true
target      = "horizon_client::game::Game<'_>::hud"
helper      = "hud_throttle.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "size", ty = "[u32; 2]",                  value = "size"        },
]

# ── Hook: game tick ───────────────────────────────────────────────────────────
[[injection]]
id      = "tick"
kind    = "HEAD"
target  = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper  = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# ── Hook: key press/release ───────────────────────────────────────────────────
[[injection]]
id      = "key"
kind    = "HEAD"
target  = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper  = "key.rs"
bindings = [
  { name = "game",    ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key",     ty = "&str",                       value = "key"        },
  { name = "pressed", ty = "bool",                       value = "pressed"    },
]

# ── Hook: player command ──────────────────────────────────────────────────────
[[injection]]
id      = "command"
kind    = "HEAD"
target  = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper  = "command.rs"
bindings = [
  { name = "game",    ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str",                       value = "command"    },
  { name = "ran",     ty = "&mut bool",                  value = "&mut *ran"  },
]

# ── Hook: Options > Mods listing ──────────────────────────────────────────────
[[injection]]
id      = "list"
kind    = "HEAD"
target  = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper  = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

# ── Hook: settings page opened ────────────────────────────────────────────────
[[injection]]
id      = "settings"
kind    = "HEAD"
target  = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper  = "settings.rs"
bindings = [
  { name = "game",    ty = "&mut crate::game::Game<'_>", value = "&mut *self"    },
  { name = "mod_id",  ty = "&str",                       value = "mod_id"        },
  { name = "buttons", ty = "&mut Vec<String>",           value = "&mut *buttons" },
]

# ── Hook: settings button clicked ─────────────────────────────────────────────
[[injection]]
id      = "click"
kind    = "HEAD"
target  = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper  = "click.rs"
bindings = [
  { name = "game",   ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str",                       value = "mod_id"     },
  { name = "button", ty = "usize",                      value = "button"     },
]
